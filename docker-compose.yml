
services:
  backend:
    image: muhsinahmad131/fyp-backend:1.0
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fyp-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

    volumes:
      - backend_uploads:/app/uploads

    networks:
      - fyp-network

  frontend:
    image: muhsinahmad131/fyp-frontend:1.0
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: fyp-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - fyp-network

volumes:
  backend_uploads:

networks:
  fyp-network:
    driver: bridge
